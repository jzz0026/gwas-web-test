version: '3.8'

services:
  # GWAS Web application service
  gwas-web:
    build: .
    container_name: gwas-web
    ports:
      - "3000:3000"
    environment:
      - PORT=${PORT:-3000}
      - DOCKER_CONTAINER=${DOCKER_CONTAINER:-gwas-worker}
      - SMTP_HOST=${SMTP_HOST:-mailserver}
      - SMTP_PORT=${SMTP_PORT:-1025}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM:-noreply@gwas.local}
      - GWAS_RUNNER_IMAGE=${GWAS_RUNNER_IMAGE:-gwas-worker:latest}
    volumes:
      - ./uploads:/app/uploads
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - mailserver
    networks:
      - gwas-network
    restart: unless-stopped

  # GWAS worker container
  gwas-worker:
    build:
      context: .
      dockerfile: Dockerfile.gwas-worker
    image: gwas-worker:latest
    container_name: gwas-worker
    # Keep container running to receive files
    command: /bin/bash -c "mkdir -p /data/input /data/output && tail -f /dev/null"
    volumes:
      - gwas-data-input:/data/input
      - gwas-data-output:/data/output
      - ./gwasScripts:/opt/gwasScripts
    networks:
      - gwas-network
    restart: unless-stopped

  # Mail server (MailHog for development)
  mailserver:
    image: mailhog/mailhog:latest
    container_name: gwas-mailserver
    ports:
      - "1025:1025"  # SMTP port
      - "8025:8025"  # Web UI port
    networks:
      - gwas-network
    restart: unless-stopped

volumes:
  gwas-data-input:
  gwas-data-output:

networks:
  gwas-network:
    driver: bridge
